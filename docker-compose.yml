networks:
  portfolio-network:
    external: true

volumes:
  mysql-volume:
  redis-volume:
  loki-volume:
  grafana-volume:

services:
  portfolio-db:
    # mysql:5.7 publishes no arm64 image, so Apple Silicon needs this pin.
    platform: linux/x86_64
    container_name: portfolio-db
    image: mysql:5.7
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    env_file:
      - ./defaults.env
      - ./override.env
    ports:
      - 3306:3306
    volumes:
      - mysql-volume:/var/lib/mysql:rw
    # The migrations runner has no restart policy, so it waits on this instead.
    healthcheck:
      # CMD-SHELL, not CMD: the exec form has no shell, so $MYSQL_ROOT_PASSWORD went to
      # mysqladmin as a literal string and every probe logged an access denial.
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h localhost -uroot -p"$$MYSQL_ROOT_PASSWORD"',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      portfolio-network:
        aliases:
          - portfolio-db

  next-app:
    depends_on:
      - portfolio-db
    container_name: next-app
    build:
      target: ${TARGET:-dev}  # prod or dev
      context: .
      dockerfile: frontend/Dockerfile
    env_file:
      - ./defaults.env
      - ./override.env
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./frontend/public:/app/frontend/public
    restart: always
    ports:
      - 3000:3000
    networks:
      portfolio-network:
        aliases:
          - next-app
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2GB
        reservations:
          cpus: '1'
          memory: 512M

  nest-api:
    container_name: nest-api
    depends_on:
      - portfolio-db
      - redis
    build:
      target: ${TARGET:-dev}
      context: .
      dockerfile: backend/Dockerfile
    environment:
      TZ: UTC
    env_file:
      - ./defaults.env
      - ./override.env
    volumes:
      - ./backend/src:/app/backend/src
    restart: unless-stopped
    ports:
      - 127.0.0.1:3002:3001 # Browsing Swagger UI @ /backend/docs
    # The endpoint runs SELECT 1, so an unhealthy container means the API is up but its
    # database is not - a distinction a port check cannot make.
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:3001/backend/api/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      portfolio-network:
        aliases:
          - nest-api

  migrations:
    profiles:
      - migrate
    depends_on:
      portfolio-db:
        condition: service_healthy
    build:
      target: migrations
      context: .
      dockerfile: backend/Dockerfile
    environment:
      TZ: UTC
    env_file:
      - ./defaults.env
      - ./override.env
    restart: "no"
    networks:
      portfolio-network:

  redis:
    container_name: redis
    image: redis:latest
    restart: unless-stopped
    ports:
      - 6379:6379
    volumes:
      - redis-volume:/data
    networks:
      portfolio-network:
        aliases:
          - redis

  loki:
    container_name: loki
    image: grafana/loki:2.9.0
    restart: unless-stopped
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-volume:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      portfolio-network:
        aliases:
          - loki

  alloy:
    container_name: alloy
    image: grafana/alloy:latest
    restart: unless-stopped
    volumes:
      - ./monitoring/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    depends_on:
      - loki
    networks:
      portfolio-network:
        aliases:
          - alloy

  prometheus:
    container_name: prometheus
    image: prom/prometheus:v2.51.0
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus-entrypoint.sh:/usr/local/bin/prometheus-entrypoint.sh:ro
    entrypoint: /usr/local/bin/prometheus-entrypoint.sh
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    env_file:
      - ./defaults.env
      - ./override.env
    ports:
      - 9090:9090
    depends_on:
      - next-app
    networks:
      portfolio-network:
        aliases:
          - prometheus

  nginx:
    container_name: nginx
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - next-app
      - nest-api
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/letsencrypt:/etc/letsencrypt:ro
      - ./nginx/dhparam.pem:/etc/ssl/certs/dhparam.pem:ro
    networks:
      portfolio-network:
        aliases:
          - nginx

  grafana:
    container_name: grafana
    image: grafana/grafana:10.4.0
    restart: unless-stopped
    volumes:
      - grafana-volume:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    env_file:
      - ./defaults.env
      - ./override.env
    environment:
      GF_USERS_ALLOW_SIGN_UP: 'false'
    ports:
      - 3001:3000
    depends_on:
      - loki
      - prometheus
    networks:
      portfolio-network:
        aliases:
          - grafana