# version: '3'

# Define a network, which allows containers to communicate
# with each other, by using their container name as a hostname
networks:
  portfolio-network:
    external: true

volumes:
  mysql-volume:
  redis-volume:
  loki-volume:
  grafana-volume:

services:
  portfolio-db:
    # NOTE: Uncomment the line below if you are using Mac with m1/m2 chip
    platform: linux/x86_64
    container_name: portfolio-db
    image: mysql:5.7
    # NOTE: use of "mysql_native_password" is not recommended: https://dev.mysql.com/doc/refman/8.0/en/upgrading-from-previous-series.html#upgrade-caching-sha2-password
    # (this is just an example, not intended to be a production configuration)
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    env_file:
      - ./defaults.env
      - ./override.env
    ports:
      - ${MYSQLDB_LOCAL_PORT:-3306}:${MYSQLDB_DOCKER_PORT:-3306}
    volumes:
      - mysql-volume:/var/lib/mysql:rw
      # - ./mysql-db:/docker-entrypoint-initdb.d/
    networks:
      portfolio-network:
        aliases:
          - portfolio-db

  # -=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-

  next-app:
    depends_on:
      - portfolio-db
    container_name: next-app
    build:
      target: ${TARGET:-dev}  # prod or dev
      context: .
      dockerfile: frontend/Dockerfile
      args:
        {
          NEXT_PUBLIC_API_TARGET: "${NEXT_PUBLIC_API_TARGET:-nest}",
          NEXT_PUBLIC_AUTH_TARGET: "${NEXT_PUBLIC_AUTH_TARGET:-nest}",
        }
    environment:
      HOST: 0.0.0.0
    # Set environment variables from defaults.env and local override.env
    env_file:
      - ./defaults.env
      - ./override.env
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./frontend/public:/app/frontend/public
    restart: always
    ports:
      - 3000:3000
    networks:
      portfolio-network:
        aliases:
          - next-app
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2GB
        reservations:
          cpus: '1'
          memory: 512M

  # -=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-

  nest-api:
    container_name: nest-api
    depends_on:
      - portfolio-db
      - redis
    build:
      target: ${TARGET:-dev}
      context: .
      dockerfile: backend/Dockerfile
    environment:
      TZ: UTC
    env_file:
      - ./defaults.env
      - ./override.env
    volumes:
      - ./backend/src:/app/backend/src
    restart: unless-stopped
    # Host 3001 is Grafana's; 3002 is the documented fallback for direct nest-api
    # access. Bound to loopback only, for browsing Swagger UI at
    # http://127.0.0.1:3002/backend/docs from the host - not for codegen, which now
    # runs inside next-app over the Compose network.
    ports:
      - 127.0.0.1:3002:3001
    networks:
      portfolio-network:
        aliases:
          - nest-api

  # -=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-

  redis:
    container_name: redis
    image: redis:latest
    restart: unless-stopped
    ports:
      - 6379:6379
    volumes:
      - redis-volume:/data
    networks:
      portfolio-network:
        aliases:
          - redis

  # -=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-

  loki:
    container_name: loki
    image: grafana/loki:2.9.0
    restart: unless-stopped
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-volume:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      portfolio-network:
        aliases:
          - loki

  # -=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-

  alloy:
    container_name: alloy
    image: grafana/alloy:latest
    restart: unless-stopped
    volumes:
      - ./monitoring/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    depends_on:
      - loki
    networks:
      portfolio-network:
        aliases:
          - alloy

  # -=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-

  prometheus:
    container_name: prometheus
    image: prom/prometheus:v2.51.0
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--enable-feature=expand-external-labels'
    env_file:
      - ./defaults.env
      - ./override.env
    ports:
      - 9090:9090
    depends_on:
      - next-app
    networks:
      portfolio-network:
        aliases:
          - prometheus

  # Simple Nginx reverse proxy to serve the app on ports 80/443
  nginx:
    container_name: nginx
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - next-app
      - nest-api
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/letsencrypt:/etc/letsencrypt:ro
      - ./nginx/dhparam.pem:/etc/ssl/certs/dhparam.pem:ro
    networks:
      portfolio-network:
        aliases:
          - nginx

  # -=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-

  grafana:
    container_name: grafana
    image: grafana/grafana:10.4.0
    restart: unless-stopped
    volumes:
      - grafana-volume:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    env_file:
      - ./defaults.env
      - ./override.env
    environment:
      GF_USERS_ALLOW_SIGN_UP: 'false'
    ports:
      - 3001:3000
    depends_on:
      - loki
      - prometheus
    networks:
      portfolio-network:
        aliases:
          - grafana