global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: nextjs-app
    static_configs:
      - targets:
          - next-app:3000
    metrics_path: /api/metrics
    # METRICS_SECRET must match .env — rotate both together and restart next-app + prometheus
    authorization:
      type: Bearer
      credentials: '${METRICS_SECRET}'

  - job_name: nestjs-backend
    static_configs:
      - targets:
          - nest-api:3001
    metrics_path: /backend/api/metrics
    authorization:
      type: Bearer
      credentials: '${METRICS_SECRET}'
