global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: nextjs-app
    static_configs:
      - targets:
          - next-app:3000
    metrics_path: /metrics
    # Written from METRICS_SECRET by prometheus-entrypoint.sh at startup; rotate the value
    # in override.env and restart next-app, nest-api and prometheus together.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-secret

  - job_name: nestjs-backend
    static_configs:
      - targets:
          - nest-api:3001
    metrics_path: /backend/api/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-secret
